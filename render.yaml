services:
  - type: web
    name: pharma-erp-api-victormanuel
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/usuarios
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
