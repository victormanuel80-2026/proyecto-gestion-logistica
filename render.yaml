services:
  - type: web
    name: pharma-erp-api-victormanuel
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/usuarios
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Token de GitHub para guardar la base de datos en la rama "datos".
      # Render lo pedirá al crear el Blueprint.
      - key: GH_DATA_TOKEN
        sync: false
